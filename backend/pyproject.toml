[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watershed-intelligence"
version = "0.1.0"
description = "Geospatial Watershed Intelligence Platform — SIH 2026 PS-26015"
requires-python = ">=3.11"

dependencies = [
    # Web framework
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.29",
    "asyncpg>=0.29.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    # Task queue
    "celery[redis]>=5.3.6",
    "redis>=5.0.3",
    # Auth
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # Geospatial
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "rasterio>=1.3.10",
    "gdal>=3.8.0",
    "numpy>=1.26.4",
    "scipy>=1.13.0",
    # Object storage
    "aioboto3>=12.3.0",
    "boto3>=1.34.0",
    # Report generation
    "python-docx>=1.1.2",
    "weasyprint>=61.2",
    "jinja2>=3.1.3",
    # Image processing
    "pillow>=10.3.0",
    "imagehash>=4.3.1",
    "opencv-python-headless>=4.9.0.80",
    # ML inference
    "onnxruntime>=1.18.0",
    # Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    # HTTP client
    "httpx>=0.27.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.1",
    "structlog>=24.1.0",
    "tenacity>=8.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.1",
    "mypy>=1.9.0",
    "factory-boy>=3.3.0",
]
gee = [
    "earthengine-api>=0.1.403",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
