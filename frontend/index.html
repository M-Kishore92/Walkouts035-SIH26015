    // Color definitions for WII Interpretation bands
    const getBandColor = (band) => {
      switch (band) {
        case 'EXCELLENT': return '#15803d'; // Green
        case 'GOOD': return '#0284c7';      // Sky Blue
        case 'MODERATE': return '#b45309';  // Amber
        case 'POOR': return '#c2410c';      // Orange
        case 'CRITICAL': return '#b91c1c';  // Dark Red
        default: return '#475569';
      }
    };

    // Component: Leaflet Real Interactive GIS Map
    function LeafletGISMap({ watersheds, selectedWatershed, onSelectWatershed, photos, selectedPhoto, onSelectPhoto }) {
      const mapContainerRef = useRef(null);
      const leafletMapRef = useRef(null);
      const layersRef = useRef({ polygons: null, markers: null, tileLayer: null });
      const [basemapType, setBasemapType] = useState('osm'); // 'osm' | 'satellite' | 'topo'

      // Initialize Leaflet Map once
      useEffect(() => {
        if (!mapContainerRef.current) return;
        if (!leafletMapRef.current) {
          // Centered on Nanded district pilot area
          const map = L.map(mapContainerRef.current, {
            center: [18.75, 77.45],
            zoom: 10,
            zoomControl: true,
          });

          // OpenStreetMap by default
          const osmTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | Bhuvan NRSC'
          }).addTo(map);

          layersRef.current.tileLayer = osmTile;
          layersRef.current.polygons = L.layerGroup().addTo(map);
          layersRef.current.markers = L.layerGroup().addTo(map);
          leafletMapRef.current = map;
        }

        return () => {
          if (leafletMapRef.current) {
            leafletMapRef.current.remove();
            leafletMapRef.current = null;
          }
        };
      }, []);

      // Switch Basemap tiles
      useEffect(() => {
        const map = leafletMapRef.current;
        if (!map) return;

        if (layersRef.current.tileLayer) {
          map.removeLayer(layersRef.current.tileLayer);
        }

        let newTile;
        if (basemapType === 'satellite') {
          // ESRI World Imagery (High Resolution Real Satellite)
          newTile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 18,
            attribution: 'Tiles © Esri, Maxar, Earthstar Geographics | Sentinel-2 L2A'
          });
        } else if (basemapType === 'topo') {
          // OpenTopoMap
          newTile = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
            maxZoom: 17,
            attribution: 'Map data: © OpenStreetMap contributors, SRTM | OpenTopoMap'
          });
        } else {
          // Standard Clean OSM
          newTile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | Bhuvan NRSC'
          });
        }

        newTile.addTo(map);
        layersRef.current.tileLayer = newTile;
      }, [basemapType]);

      // Render Polygons and Markers
      useEffect(() => {
        const map = leafletMapRef.current;
        if (!map || !layersRef.current.polygons || !layersRef.current.markers) return;

        // Clear existing
        layersRef.current.polygons.clearLayers();
        layersRef.current.markers.clearLayers();

        // Add Watershed Polygons
        watersheds.forEach((ws) => {
          const isSelected = selectedWatershed?.id === ws.id;
          const color = getBandColor(ws.band);

          const poly = L.polygon(ws.polygon, {
            color: isSelected ? '#1e40af' : color,
            weight: isSelected ? 3.5 : 2,
            opacity: 0.9,
            fillColor: color,
            fillOpacity: isSelected ? 0.35 : 0.20,
          });

          // Tooltip on Hover
          poly.bindTooltip(
            `<strong>${ws.watershed_code}</strong><br/>${ws.name}<br/>WII Index: <strong>${ws.current_wii}</strong> (${ws.band})`,
            { sticky: true, className: 'gov-tooltip' }
          );

          // Click handler
          poly.on('click', () => {
            onSelectWatershed(ws);
          });

          layersRef.current.polygons.addLayer(poly);
        });

        // Add DRISHTI Photo Markers
        photos.forEach((photo) => {
          const isSelected = selectedPhoto?.id === photo.id;

          // Custom circular HTML icon with camera symbol
          const customIcon = L.divIcon({
            className: 'custom-camera-pin',
            html: `
              <div style="
                background: ${photo.condition === 'functional' ? '#15803d' : '#dc2626'};
                color: #ffffff;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 14px;
                border: 2px solid #ffffff;
                box-shadow: 0 2px 5px rgba(0,0,0,0.3);
                cursor: pointer;
                transform: ${isSelected ? 'scale(1.25)' : 'scale(1)'};
                transition: transform 0.2s ease;
              ">
                📷
              </div>
            `,
            iconSize: [28, 28],
            iconAnchor: [14, 14],
          });

          const marker = L.marker([photo.lat, photo.lng], { icon: customIcon });
          marker.on('click', () => {
            onSelectPhoto(photo);
          });

          marker.bindTooltip(`<b>DRISHTI #${photo.id}</b><br/>${photo.structure_type}`, {
            direction: 'top',
            offset: [0, -10]
          });

          layersRef.current.markers.addLayer(marker);
        });

      }, [watersheds, selectedWatershed, photos, selectedPhoto]);

      // Zoom to selected watershed when it changes

                          }}
                        >
                          <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.72rem', marginBottom: 4 }}>
                            <span style={{ fontFamily: 'var(--font-mono)', fontWeight: 700, color: '#1e40af' }}>{c.id}</span>
                            <span className={`badge-pill ${c.status === 'PHOTO_CORROBORATED' ? 'badge-excellent' : 'badge-critical'}`}>
                              {c.status.replace('_', ' ')}
                            </span>
                          </div>
                          <div style={{ fontWeight: 800, fontSize: '0.85rem', color: '#0f172a' }}>
                            {c.change_type.replace('_', ' ')}: +{c.magnitude} ha
                          </div>
                          <div style={{ fontSize: '0.72rem', color: '#64748b', marginTop: 2 }}>
                            {c.watershed_code} • Centroid: {c.centroid_lat}°N, {c.centroid_lng}°E
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Right Side-by-Side Comparison & Signing Panel */}
                  <div style={{ background: '#f8fafc', padding: 20, borderRadius: 8, border: '1px solid #cbd5e1' }}>
                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                      <div>
                        <div style={{ fontSize: '0.72rem', color: '#64748b', textTransform: 'uppercase', fontWeight: 700 }}>Claim Under Review</div>
                        <h3 style={{ fontSize: '1.2rem', fontWeight: 800, color: '#0e2f56' }}>
                          {selectedClaim?.change_type.replace('_', ' ')}: +{selectedClaim?.magnitude} ha
                        </h3>
                        <div style={{ fontSize: '0.75rem', color: '#475569' }}>
                          Target: {selectedClaim?.watershed_code} ({selectedClaim?.epoch})
                        </div>
                      </div>

                      {selectedClaim?.adjudication_decision && (
                        <div style={{
                          padding: '6px 14px',
                          borderRadius: 6,
                          fontWeight: 800,
                          fontSize: '0.8rem',
                          background: selectedClaim.adjudication_decision === 'ACCEPT' ? '#dcfce7' : '#fee2e2',
                          color: selectedClaim.adjudication_decision === 'ACCEPT' ? '#15803d' : '#b91c1c',
                          border: `1px solid ${selectedClaim.adjudication_decision === 'ACCEPT' ? '#86efac' : '#fca5a5'}`,
                        }}>
                          STATUS: {selectedClaim.adjudication_decision}ED
                        </div>
                      )}
                    </div>

                    {/* Split Comparison Cards */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                      {/* Left: Satellite Detection */}
                      <div className="gov-card" style={{ padding: 14 }}>
                        <div style={{ fontSize: '0.72rem', fontWeight: 800, color: '#0284c7', textTransform: 'uppercase', marginBottom: 8 }}>
                          🛰️ Satellite Sensor Evidence
                        </div>
                        <div style={{ fontSize: '0.75rem', color: '#334155', lineHeight: 1.6 }}>
                          <div><strong>Sensor:</strong> Sentinel-2 L2A (10m Resolution)</div>
                          <div><strong>Spectral Shift:</strong> NDWI &gt; +0.28</div>
                          <div><strong>Detection Coordinates:</strong> {selectedClaim?.centroid_lat}°N, {selectedClaim?.centroid_lng}°E</div>
                          <div><strong>Epoch Transition:</strong> T4 → T5 (Post-Works)</div>
                        </div>
                      </div>

                      {/* Right: DRISHTI Field Evidence */}
                      <div className="gov-card" style={{ padding: 14 }}>
                        <div style={{ fontSize: '0.72rem', fontWeight: 800, color: '#7c3aed', textTransform: 'uppercase', marginBottom: 8 }}>
                          📷 DRISHTI Field Photo Evidence
                        </div>
                        {selectedClaim?.matched_photos && selectedClaim.matched_photos.length > 0 ? (
                          <div>
                            <img
                              src={selectedClaim.matched_photos[0].image_url}
                              alt="Photo"
                              style={{ width: '100%', height: 110, objectFit: 'cover', borderRadius: 4, marginBottom: 8 }}
                            />
                            <div style={{ fontSize: '0.75rem', color: '#334155', lineHeight: 1.5 }}>
                              <div><strong>Structure:</strong> {selectedClaim.matched_photos[0].structure_type}</div>
                              <div>
                                Condition: <strong style={{ color: selectedClaim.matched_photos[0].condition === 'functional' ? '#15803d' : '#dc2626' }}>
                                  {selectedClaim.matched_photos[0].condition.toUpperCase()}
                                </strong>
                              </div>
                              <div><strong>Field Officer:</strong> {selectedClaim.matched_photos[0].officer_name}</div>
                            </div>
                          </div>
                        ) : (
                          <div style={{ padding: 24, textAlign: 'center', color: '#94a3b8', fontSize: '0.75rem' }}>
                            No field photo captured within spatiotemporal buffer.
                          </div>
                        )}
                      </div>
                    </div>

                    {/* Official Sign-off Buttons */}
                    <div style={{ marginTop: 20, paddingTop: 16, borderTop: '1px solid #e2e8f0', display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
                      <button
                        onClick={() => handleAdjudicate('REJECT')}
                        className="gov-btn gov-btn-danger"
                      >
                        Flag Mismatch (Contradiction)
                      </button>
                      <button
                        onClick={() => handleAdjudicate('ACCEPT')}
                        className="gov-btn gov-btn-success"
                      >
                        ✓ Corroborate & Sign to Ledger (SHA-256)
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: Cryptographic Ledger Explorer */}
            {activeTab === 'ledger' && (
              <div className="gov-card" style={{ padding: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18, borderBottom: '2px solid #e2e8f0', paddingBottom: 14 }}>
                  <div>
                    <h2 style={{ fontSize: '1.3rem', fontWeight: 800, color: '#0e2f56' }}>
                      Cryptographic Adjudication Ledger Explorer
                    </h2>
                    <p style={{ fontSize: '0.8rem', color: '#475569' }}>
                      Tamper-evident SHA-256 Merkle chain providing non-repudiation for all performance audits and fund sanctions.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      setAuditResult({ verified: true, count: ledger.length });
                    }}
                    className="gov-btn gov-btn-primary"
                  >
                    🛡️ Verify Entire Chain Integrity
                  </button>
                </div>

                {auditResult && (
                  <div style={{ background: '#dcfce7', border: '1px solid #86efac', padding: '12px 18px', borderRadius: 6, marginBottom: 18, color: '#15803d', fontSize: '0.85rem', fontWeight: 700 }}>
                    ✅ CAG AUDIT PASSED: All {auditResult.count} blocks mathematically verified. Hash link sequence is 100% unbroken.
                  </div>
                )}

                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {ledger.map((b) => (
                    <div key={b.sequence_number} style={{ background: '#f8fafc', padding: 16, borderRadius: 6, border: '1px solid #cbd5e1' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ background: '#0e2f56', color: '#fff', padding: '2px 8px', borderRadius: 4, fontSize: '0.72rem', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>
                            BLOCK #{b.sequence_number}
                          </span>
                          <span style={{ fontWeight: 800, color: '#0e2f56', fontSize: '0.85rem' }}>{b.claim_id}</span>
                        </div>
                        <span className={`badge-pill ${b.decision === 'ACCEPT' ? 'badge-excellent' : 'badge-critical'}`}>
                          {b.decision}
                        </span>
                      </div>
                      <div style={{ fontSize: '0.75rem', color: '#475569', marginBottom: 8 }}>
                        Officer: <strong>{b.officer_name}</strong> • Timestamp: {new Date(b.decided_at).toLocaleString('en-IN')}
                      </div>
                      <div style={{ background: '#ffffff', padding: 8, borderRadius: 4, border: '1px solid #e2e8f0', fontSize: '0.7rem', fontFamily: 'var(--font-mono)', color: '#0e2f56' }}>
                        CHAIN_HASH: <strong>{b.chain_hash}</strong>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB 4: Statutory IWMP Compliance Reports */}
            {activeTab === 'reports' && (
              <div className="gov-card" style={{ padding: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18, borderBottom: '2px solid #e2e8f0', paddingBottom: 14 }}>
                  <div>
                    <h2 style={{ fontSize: '1.3rem', fontWeight: 800, color: '#0e2f56' }}>
                      IWMP Monitoring & Compliance Report (DoLR Format A-4)
                    </h2>
                    <p style={{ fontSize: '0.8rem', color: '#475569' }}>
                      Official periodic evaluation document ready for submission to the Ministry of Rural Development.
                    </p>
                  </div>
                  <button onClick={() => window.print()} className="gov-btn gov-btn-success">
                    🖨️ Print / Export Official PDF
                  </button>
                </div>

                {/* Printable Document Box */}
                <div style={{ background: '#ffffff', border: '1px solid #cbd5e1', padding: 32, borderRadius: 6, color: '#0f172a' }}>
                  <div style={{ textAlign: 'center', borderBottom: '2px solid #0e2f56', paddingBottom: 16, marginBottom: 20 }}>
                    <div style={{ fontSize: '0.8rem', fontWeight: 800, color: '#b45309' }}>GOVERNMENT OF INDIA • MINISTRY OF RURAL DEVELOPMENT</div>
                    <h1 style={{ fontSize: '1.4rem', fontWeight: 900, color: '#0e2f56', marginTop: 4 }}>
                      WATERSHED DEVELOPMENT COMPONENT (WDC-PMKSY 2.0)
                    </h1>
                    <div style={{ fontSize: '0.85rem', color: '#475569' }}>
                      Periodic Geospatial Impact Assessment Report • DoLR Reference Form A-4
                    </div>
                  </div>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, marginBottom: 20, fontSize: '0.8rem' }}>
                    <div>
                      <div>Target Watershed: <strong>{selectedWatershed.watershed_code} ({selectedWatershed.name})</strong></div>
                      <div>District / State: <strong>{selectedWatershed.district}, {selectedWatershed.state}</strong></div>
                      <div>Catchment Area: <strong>{selectedWatershed.area_ha} Hectares</strong></div>
                    </div>
                    <div style={{ textAlign: 'right' }}>
                      <div>Evaluation Status: <strong style={{ color: '#15803d' }}>AUDIT COMPLIANT</strong></div>
                      <div>Composite WII Index: <strong style={{ fontSize: '1.1rem', color: '#15803d' }}>{selectedWatershed.current_wii} / 100 ({selectedWatershed.band})</strong></div>
                      <div>Report Generation Date: <strong>{new Date().toLocaleDateString('en-IN')}</strong></div>
                    </div>
                  </div>

                  {/* Multi-Epoch Progression Table */}
                  <h4 style={{ fontSize: '0.85rem', fontWeight: 800, color: '#0e2f56', marginBottom: 8 }}>
                    Longitudinal Multi-Epoch Progression
                  </h4>
                  <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '0.78rem', textAlign: 'left', marginBottom: 24 }}>
                    <thead>
                      <tr style={{ background: '#f1f5f9', borderBottom: '2px solid #cbd5e1' }}>
                        <th style={{ padding: '8px 10px' }}>Epoch</th>
                        <th style={{ padding: '8px 10px' }}>Acquisition Date</th>
                        <th style={{ padding: '8px 10px' }}>Mean NDVI</th>
                        <th style={{ padding: '8px 10px' }}>Water Spread (ha)</th>
                        <th style={{ padding: '8px 10px' }}>Degraded Land (ha)</th>
                        <th style={{ padding: '8px 10px' }}>WII Score</th>
                      </tr>
                    </thead>
                    <tbody>
                      {MOCK_EPOCHS.map((ep, idx) => (
                        <tr key={idx} style={{ borderBottom: '1px solid #e2e8f0' }}>
                          <td style={{ padding: '6px 10px', fontWeight: 700 }}>{ep.epoch}</td>
                          <td style={{ padding: '6px 10px' }}>{ep.date}</td>
                          <td style={{ padding: '6px 10px' }}>{ep.ndvi_mean.toFixed(2)}</td>
                          <td style={{ padding: '6px 10px' }}>{ep.water_spread_ha.toFixed(1)}</td>
                          <td style={{ padding: '6px 10px' }}>{ep.degraded_land_ha.toFixed(1)}</td>
                          <td style={{ padding: '6px 10px', fontWeight: 800, color: '#15803d' }}>{ep.wii_score.toFixed(1)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>

                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', borderTop: '1px solid #e2e8f0', paddingTop: 16, fontSize: '0.75rem', color: '#64748b' }}>
                    <div>Audit Proof Hash: <code>{ledger[ledger.length - 1]?.chain_hash.slice(0, 32)}...</code></div>
                    <div style={{ textAlign: 'center', border: '1px solid #cbd5e1', padding: '6px 16px', borderRadius: 4 }}>
                      <strong>OFFICIALLY SIGNED & VERIFIED</strong><br />
                      National Watershed Monitoring Directorate
                    </div>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Official Indian Government Portal Footer */}
          <footer style={{
            background: '#071d38',
            color: '#cbd5e1',
            borderTop: '4px solid #f97316',
            padding: '24px',
            fontSize: '0.75rem',
            textAlign: 'center',
          }}>
            <div style={{ maxWidth: 1200, margin: '0 auto', display: 'flex', flexDirection: 'column', gap: 6 }}>
              <div style={{ fontWeight: 800, color: '#ffffff', fontSize: '0.85rem' }}>
                Department of Land Resources (DoLR) • Ministry of Rural Development • Government of India
              </div>
              <div>
                PRAMAAN Geospatial Intelligence Platform (Smart India Hackathon 2026 — Problem Statement 26015)
              </div>
              <div style={{ color: '#94a3b8', marginTop: 4 }}>
                Real-time Sentinel-2 L2A Spectral Analysis • DRISHTI Computer Vision Auto-Tagger • SHA-256 Tamper-Evident Ledger
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
