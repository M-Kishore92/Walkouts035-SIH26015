      border-radius: 14px;

      border-radius: 9999px;
      font-size: 0.75rem;

    button { font-family: inherit; cursor: pointer; transition: all 0.2s ease; }

                        <h3 style={{ fontSize: '1.2rem', fontWeight: 800, marginTop: 8 }}>{selectedWatershed.watershed_code}</h3>
                        <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>{selectedWatershed.name}, {selectedWatershed.block} Block</div>
                        <div style={{ marginTop: 14, display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, fontSize: '0.8rem' }}>
                          <div style={{ background: 'rgba(255,255,255,0.03)', padding: 8, borderRadius: 6 }}>
                            <div style={{ color: '#64748b' }}>WII Score</div>
                            <div style={{ fontWeight: 800, color: getBandColor(selectedWatershed.band), fontSize: '1.2rem' }}>{selectedWatershed.current_wii}</div>
                          </div>
                          <div style={{ background: 'rgba(255,255,255,0.03)', padding: 8, borderRadius: 6 }}>
                            <div style={{ color: '#64748b' }}>Photo Corroborated</div>
                            <div style={{ fontWeight: 800, color: '#34d399', fontSize: '1.2rem' }}>{selectedWatershed.photo_corroboration_rate}%</div>
                          </div>
                        </div>
                      </div>

                      {selectedPhoto && (
                        <div className="glass-panel" style={{ padding: 14, border: '1px solid rgba(139,92,246,0.5)' }}>
                          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 6 }}>
                            <span style={{ fontSize: '0.75rem', fontWeight: 700, color: '#a78bfa' }}>DRISHTI GROUND TRUTH #{selectedPhoto.id}</span>
                            <button onClick={() => setSelectedPhoto(null)} style={{ background: 'none', border: 'none', color: '#94a3b8' }}>✕</button>
                          </div>
                          <img src={selectedPhoto.image_url} alt="Site" style={{ width: '100%', height: 110, objectFit: 'cover', borderRadius: 6, marginBottom: 8 }} />
                          <div style={{ fontSize: '0.8rem', fontWeight: 700 }}>{selectedPhoto.structure_type}</div>
                          <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Condition: <strong style={{ color: selectedPhoto.condition === 'functional' ? '#34d399' : '#f87171' }}>{selectedPhoto.condition.toUpperCase()}</strong></div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'adjudication' && (
              <div className="glass-panel" style={{ padding: 24 }}>
                <h2 style={{ fontSize: '1.25rem', fontWeight: 700, marginBottom: 16 }}>Cross-Validation Adjudication Studio</h2>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 2fr', gap: 20 }}>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                    {claims.map((c) => (
                      <div key={c.id} style={{ background: 'rgba(255,255,255,0.03)', padding: 12, borderRadius: 8, border: '1px solid rgba(255,255,255,0.08)' }}>
                        <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '0.75rem' }}>
                          <span style={{ color: '#38bdf8', fontFamily: 'monospace' }}>{c.id}</span>
                          <span style={{ color: c.status === 'PHOTO_CORROBORATED' ? '#34d399' : '#f87171', fontWeight: 700 }}>{c.status}</span>
                        </div>
                        <div style={{ fontWeight: 700, marginTop: 4 }}>{c.change_type}: +{c.magnitude} ha</div>
                        <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{c.watershed_code}</div>
                      </div>
                    ))}
                  </div>

                  <div style={{ background: 'rgba(0,0,0,0.3)', padding: 20, borderRadius: 10 }}>
                    <h3>Claim Inspection: {claims[0]?.id}</h3>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16, marginTop: 14 }}>
                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: 12, borderRadius: 8 }}>
                        <div style={{ color: '#38bdf8', fontWeight: 700, fontSize: '0.8rem', marginBottom: 6 }}>🛰️ SATELLITE DETECTION</div>
                        <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>NDWI Surface Water Shift +8.2 ha detected by Sentinel-2 L2A at 18.558°N, 77.584°E.</div>
                      </div>
                      <div style={{ background: 'rgba(255,255,255,0.03)', padding: 12, borderRadius: 8 }}>
                        <div style={{ color: '#a78bfa', fontWeight: 700, fontSize: '0.8rem', marginBottom: 6 }}>📷 DRISHTI FIELD PHOTO</div>
                        <div style={{ fontSize: '0.8rem', color: '#94a3b8' }}>Masonry Check Dam (Condition: FUNCTIONAL) verified by Suresh Patil.</div>
                      </div>
                    </div>
                    <div style={{ marginTop: 20, display: 'flex', gap: 12, justifyContent: 'flex-end' }}>
                      <button style={{ background: 'rgba(239, 68, 68, 0.2)', color: '#f87171', border: '1px solid #ef4444', padding: '8px 16px', borderRadius: 8 }}>Flag Mismatch</button>
                      <button style={{ background: 'linear-gradient(135deg, #10b981, #059669)', color: '#fff', border: 'none', padding: '8px 20px', borderRadius: 8, fontWeight: 700 }}>✓ Corroborate & Sign to Ledger</button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {activeTab === 'ledger' && (
              <div className="glass-panel" style={{ padding: 24 }}>
                <h2 style={{ fontSize: '1.25rem', fontWeight: 700, marginBottom: 16 }}>Cryptographic Adjudication Ledger Explorer</h2>
                <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
                  {ledger.map((b) => (
                    <div key={b.sequence_number} style={{ background: 'rgba(0,0,0,0.3)', padding: 16, borderRadius: 8, border: '1px solid rgba(255,255,255,0.08)' }}>
                      <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                        <span style={{ fontWeight: 800, color: '#38bdf8' }}>BLOCK #{b.sequence_number} ({b.claim_id})</span>
                        <span style={{ color: '#34d399', fontWeight: 700 }}>{b.decision}</span>
                      </div>
                      <div style={{ fontSize: '0.75rem', color: '#94a3b8' }}>Officer: {b.officer_name}</div>
                      <div style={{ background: '#070b14', padding: 8, borderRadius: 6, marginTop: 8, fontSize: '0.7rem', fontFamily: 'monospace', color: '#10b981' }}>
                        CHAIN_HASH: {b.chain_hash}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'reports' && (
              <div className="glass-panel" style={{ padding: 24 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
                  <h2 style={{ fontSize: '1.25rem', fontWeight: 700 }}>IWMP Monitoring & Compliance Report (DoLR Format)</h2>
                  <button onClick={() => window.print()} style={{ background: '#10b981', color: '#fff', border: 'none', padding: '8px 16px', borderRadius: 8, fontWeight: 700 }}>Print / Export PDF</button>
                </div>
                <div style={{ background: '#fff', color: '#000', padding: 24, borderRadius: 8 }}>
                  <h3 style={{ borderBottom: '2px solid #000', paddingBottom: 8 }}>Department of Land Resources — Integrated Watershed Evaluation</h3>
                  <p style={{ marginTop: 12, fontSize: '0.9rem' }}>Micro-Watershed <strong>{selectedWatershed.watershed_code}</strong>: Composite WII Score <strong>{selectedWatershed.current_wii} / 100 ({selectedWatershed.band})</strong>. All works corroborated with DRISHTI field geotagging.</p>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
